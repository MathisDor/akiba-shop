name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # The deploy key's authorized_keys entry on the server forces this
          # exact command server-side regardless of what's sent here — kept
          # for readability, not actually load-bearing.
          script: cd public_html && bash deploy.sh
