name: Deploy to production

# Runs only after the CI workflow has finished successfully on main, so a
# regression that fails tests or Pint never reaches production.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Deploy over SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's authorized_keys entry for this key forces the deploy
          # command regardless of what's requested here — no shell, no other
          # access. StrictHostKeyChecking=accept-new pins the host key on
          # first connect instead of skipping verification entirely.
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "true"
