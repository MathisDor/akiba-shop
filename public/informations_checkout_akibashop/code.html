<style>
        .input-underline {
            border: none;
            border-bottom: 1px solid theme('colors.outline-variant');
            border-radius: 0;
            padding-left: 0;
            padding-right: 0;
            background-color: transparent;
            transition: border-color 0.3s ease;
            box-shadow: none !important;
        }
        .input-underline:focus {
            outline: none;
            border-bottom: 1px solid theme('colors.primary');
        }
        
        /* Floating label logic */
        .relative-input-group {
            position: relative;
            margin-bottom: theme('spacing.base') * 4;
            padding-top: theme('spacing.base') * 2;
        }
        .relative-input-group label {
            position: absolute;
            top: 24px;
            left: 0;
            pointer-events: none;
            transition: 0.2s ease all;
            color: theme('colors.outline');
        }
        .relative-input-group input:focus ~ label,
        .relative-input-group input:not(:placeholder-shown) ~ label {
            top: 0;
            font-size: 11px;
            color: theme('colors.on-surface-variant');
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col selection:bg-secondary selection:text-on-secondary">
<!-- Transactional Header (Simplified TopAppBar) -->
<header class="w-full flex justify-between items-center px-container-margin-mobile md:px-container-margin-desktop py-4 bg-surface z-50 sticky top-0">
<button aria-label="Retour au panier" class="text-primary hover:opacity-70 transition-opacity flex items-center justify-center w-10 h-10 -ml-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">arrow_back_ios_new</span>
</button>
<div class="h-10">
<img alt="AkibaShop" class="h-full w-auto object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuACNu6AYoMuQyB9950Wfg6IzPtgNSM_xTxNp_JPvfUXPIY9XM-HMiV7CxEs3lKFSLuQVSk-gHCVv7_2G7OhX6J_l3P4ddMBoQZTFF4LnVk-sHjsuJ0JuV7tsYRPGtQjWrw1zl31NEZ6M0o7O7eaLY_HcjVLVJFgQluY0mEyJ3rgi0zUj_ra5qs_OMeW17KkIMJMITW06ne9jqUPmueh79__N1TNE7-ivlOAPv9Evbns9RZZ2QDDu88babT9e391sQ6NlOs"/>
</div>
<div class="w-10 h-10 flex items-center justify-center text-outline">
<span class="material-symbols-outlined" style="font-variation-settings: 'wght' 300;">lock</span>
</div>
</header>
<main class="flex-grow flex flex-col w-full max-w-2xl mx-auto px-container-margin-mobile md:px-0 pt-4 pb-32">
<!-- Progress Indicator -->
<div class="flex items-center justify-center w-full mb-12">
<div class="flex items-center space-x-2 md:space-x-4">
<div class="flex items-center text-primary">
<span class="font-label-sm text-label-sm uppercase tracking-widest">Infos</span>
</div>
<div class="w-8 h-px bg-outline-variant"></div>
<div class="flex items-center text-outline opacity-50">
<span class="font-label-sm text-label-sm uppercase tracking-widest">Livraison</span>
</div>
<div class="w-8 h-px bg-outline-variant"></div>
<div class="flex items-center text-outline opacity-50">
<span class="font-label-sm text-label-sm uppercase tracking-widest">Paiement</span>
</div>
</div>
</div>
<!-- Section Title -->
<div class="mb-10 text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-2">
                Informations Personnelles
            </h1>
<p class="font-body-md text-body-md text-on-surface-variant">
                Veuillez saisir vos coordonnées pour la livraison de votre commande.
            </p>
</div>
<!-- Checkout Form -->
<form class="flex flex-col gap-8 w-full">
<div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-6">
<!-- Prénom -->
<div class="relative-input-group">
<input class="input-underline w-full font-body-md text-body-md text-primary h-10" id="prenom" placeholder=" " required="" type="text"/>
<label class="font-body-md" for="prenom">Prénom</label>
</div>
<!-- Nom -->
<div class="relative-input-group">
<input class="input-underline w-full font-body-md text-body-md text-primary h-10" id="nom" placeholder=" " required="" type="text"/>
<label class="font-body-md" for="nom">Nom</label>
</div>
</div>
<!-- Email -->
<div class="relative-input-group">
<input class="input-underline w-full font-body-md text-body-md text-primary h-10" id="email" placeholder=" " required="" type="email"/>
<label class="font-body-md" for="email">Adresse Email</label>
</div>
<!-- Téléphone (with prefix) -->
<div class="relative-input-group flex items-end">
<div class="flex items-center border-b border-outline-variant pb-2 mr-4 text-on-surface-variant font-body-md h-10">
<span class="mr-1 mt-1">🇬🇦</span>
<span>+241</span>
</div>
<div class="flex-grow relative">
<input class="input-underline w-full font-body-md text-body-md text-primary h-10" id="telephone" pattern="[0-9]{7,9}" placeholder=" " required="" type="tel"/>
<label class="font-body-md" for="telephone">Numéro de téléphone</label>
</div>
</div>
<!-- Optional: Newsletter / Account Creation Checkbox -->
<div class="mt-4 flex items-start">
<div class="flex items-center h-5">
<input class="w-5 h-5 rounded-sm border-outline-variant text-primary focus:ring-primary focus:ring-offset-surface bg-transparent transition-colors cursor-pointer" id="newsletter" type="checkbox"/>
</div>
<div class="ml-3">
<label class="font-body-md text-body-md text-on-surface-variant cursor-pointer" for="newsletter">
                        M'inscrire aux exclusivités et nouveautés AkibaShop
                    </label>
</div>
</div>
<!-- Desktop Action Button (Hidden on Mobile, shown on MD+) -->
<div class="hidden md:flex justify-end mt-12">
<button class="bg-primary text-on-primary h-12 px-8 rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:bg-tertiary transition-colors duration-300 flex items-center justify-center min-w-[240px]" type="button">
                    Continuer vers la livraison
                    <span class="material-symbols-outlined ml-2 text-[18px]">arrow_forward</span>
</button>
</div>
</form>
</main>
<!-- Mobile Sticky Bottom Action Bar -->
<div class="md:hidden fixed bottom-0 left-0 w-full bg-surface/95 backdrop-blur-md border-t border-surface-container-high p-4 z-40 pb-safe shadow-[0_-10px_40px_rgba(0,0,0,0.05)]">
<button class="w-full bg-primary text-on-primary h-[56px] rounded-full font-label-sm text-label-sm uppercase tracking-widest hover:opacity-90 active:scale-[0.98] transition-all duration-200 flex items-center justify-center" type="button">
            Continuer vers la livraison
        </button>
</div>
<!-- Safe area padding for newer mobile devices -->
<style>
        .pb-safe { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</body></html>
