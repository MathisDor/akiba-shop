; PHP's tmpfile()/sys_get_temp_dir() (used by Livewire for uploads) fail
; when pointed at the OS-wide temp dir. Redirect both to a writable
; directory inside the account itself.
upload_tmp_dir = "/home/vol18_2/infinityfree.com/if0_42627785/htdocs/storage/app/tmp"
sys_temp_dir = "/home/vol18_2/infinityfree.com/if0_42627785/htdocs/storage/app/tmp"
